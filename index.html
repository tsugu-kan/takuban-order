<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24457a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卓番オーダー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{box-sizing:border-box}body{margin:0;font-size:14px;overscroll-behavior:none}
img{max-width:100%}[hidden]{display:none!important}
html,body{height:100%}
</style>
<title>卓番オーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app, top bar + scrolling body + fixed bottom action bar, like a handheld order pad */
:root{
  --bg:#eef1f4; --surface:#ffffff; --line:#d5dbe3; --fg:#1d2733; --muted:#5f6b7a;
  --ai:#24457a; --ai-ink:#ffffff; --ai-soft:#e2e9f5; --shu:#c4432b;
  --display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171e; --surface:#1b222c; --line:#2e3846; --fg:#e7ecf2; --muted:#9aa6b5;
  --ai:#7fa3e0; --ai-ink:#0e1520; --ai-soft:#22314a; --shu:#ec7a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1b222c; --line:#2e3846; --fg:#e7ecf2; --muted:#9aa6b5;
  --ai:#7fa3e0; --ai-ink:#0e1520; --ai-soft:#22314a; --shu:#ec7a62; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.bar h1{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;flex:1;min-width:0;letter-spacing:.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--ai-soft)}
.iconbtn svg{width:24px;height:24px}
.textbtn{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:.9rem}
.textbtn:hover{background:var(--ai-soft);color:var(--fg)}
.main{flex:1;overflow-y:auto;padding:4px 16px 16px}
.foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center}
.primary{background:var(--ai);color:var(--ai-ink);border-radius:14px;padding:14px 20px;font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);border-radius:14px;padding:13px 18px;font-weight:500;background:var(--surface)}
.danger{color:var(--shu)}
.num{font-variant-numeric:tabular-nums}

/* start */
.start{flex:1;display:grid;place-items:center;padding:16px;text-align:center}
.start .eyebrow{color:var(--muted);font-size:.85rem;letter-spacing:.2em;margin-bottom:20px}
.openbtn{font-family:var(--display);font-size:1.9rem;letter-spacing:.08em;width:220px;height:220px;border-radius:50%;background:var(--ai);color:var(--ai-ink);box-shadow:0 0 0 10px var(--ai-soft)}
.openbtn:active{transform:scale(.97)}
.start .hint{margin-top:28px;color:var(--muted);font-size:.85rem}

/* tables */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.table .no{font-family:var(--display);font-size:2.2rem;line-height:1}
.table .no small{font-family:var(--body);font-size:.85rem;font-weight:700;margin-left:4px;color:var(--muted)}
.table .st{font-size:.85rem;color:var(--muted);margin-top:auto}
.table.busy{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.table.busy .st{color:var(--ai);font-weight:700}

/* tabs */
.tabs{display:flex;gap:6px;padding:0 16px 8px}
.tab{flex:1;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.tab[aria-selected="true"]{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;min-height:64px}
.item.on{border-color:var(--ai)}
.item .name{flex:1;min-width:0;text-align:left;padding:10px 0;display:flex;flex-direction:column;gap:2px}
.item .name b{font-weight:700;overflow-wrap:anywhere}
.item .name span{color:var(--muted);font-size:.85rem}
.step{display:flex;align-items:center;gap:4px}
.step button{width:48px;height:48px;border-radius:12px;background:var(--ai-soft);font-size:1.5rem;font-weight:700;color:var(--ai)}
.step .c{min-width:36px;text-align:center;font-family:var(--display);font-size:1.3rem}
.empty{color:var(--muted);text-align:center;padding:32px 8px}
.sum{flex:1;min-width:0}
.sum small{display:block;color:var(--muted);font-size:.8rem}
.sum b{font-family:var(--display);font-weight:400;font-size:1.3rem}

/* bill */
.bill{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.row:last-child{border-bottom:0}
.row .q{color:var(--muted)}
.row .p{text-align:right;min-width:72px}
.cat{font-size:.75rem;letter-spacing:.15em;color:var(--muted);padding-top:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px 4px}
.total span{color:var(--muted)}
.total b{font-family:var(--display);font-weight:400;font-size:2.2rem}

/* report */
.running{color:var(--muted);font-size:.85rem;padding:0 2px 12px}
.running b{color:var(--fg)}
.hero-total{background:var(--ai);color:var(--ai-ink);border-radius:18px;padding:20px;margin-bottom:24px;display:flex;flex-direction:column;gap:4px}
.hero-total small{font-size:.85rem;letter-spacing:.15em;opacity:.85}
.hero-total b{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1.1}
.hero-total .meta{font-size:.85rem;opacity:.85}
.sec h2 span{letter-spacing:0;font-weight:500}

/* settings */
.sec{margin-bottom:24px}
.sec h2{font-size:.85rem;letter-spacing:.15em;color:var(--muted);margin:8px 0 10px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px}
.edit{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;align-items:center;padding:6px 0}
.edit input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
.edit input.price{text-align:right}
.del{width:40px;height:40px;border-radius:10px;color:var(--shu);font-size:1.2rem}
.del:hover{background:var(--ai-soft)}
.add{margin-top:8px;width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--ai);font-weight:700}
.note{color:var(--muted);font-size:.8rem;margin-top:8px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%}
.dlg p{margin:0 0 18px;line-height:1.6}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:11}
@media (prefers-reduced-motion:no-preference){.openbtn,.step button{transition:transform .08s}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>

<script>
const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const CATS=[['drink','ドリンク'],['food','料理']];
const KEY='takuban-order-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const defaults=()=>({
  tables:5,
  menu:{
    drink:[{id:uid(),name:'コーラ',price:300},{id:uid(),name:'緑茶',price:250},{id:uid(),name:'オレンジジュース',price:300}],
    food:[{id:uid(),name:'牛丼',price:500},{id:uid(),name:'オムライス',price:800},{id:uid(),name:'ラーメン',price:750}]
  },
  orders:{}, open:false
});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.menu)S=defaults();
S.sales=S.sales||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let view={name:S.open?'tables':'start',table:null,tab:'drink',expanded:new Set()};
const app=document.getElementById('app'),layer=document.getElementById('layer');

const allItems=()=>[...S.menu.drink,...S.menu.food];
const findItem=id=>allItems().find(i=>i.id===id);
function tableInfo(t){
  const o=S.orders[t]||{};let qty=0,sum=0;
  for(const [id,q] of Object.entries(o)){const it=findItem(id);if(it&&q>0){qty+=q;sum+=q*it.price}}
  return{qty,sum};
}
function go(name,extra={}){Object.assign(view,{name},extra);render()}

function render(){
  ({start,tables,menu,bill,settings,report})[view.name]();
}
const salesTotal=()=>S.sales.reduce((a,s)=>a+s.total,0);

function report(){
  const agg={drink:{},food:{}};
  for(const s of S.sales)for(const it of s.items){
    const g=agg[it.cat]||(agg[it.cat]={});const key=it.name;
    g[key]=g[key]||{name:it.name,qty:0,amount:0};g[key].qty+=it.qty;g[key].amount+=it.qty*it.price;
  }
  const hm=t=>t?new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—';
  const total=salesTotal();
  const block=([k,l])=>{
    const rows=Object.values(agg[k]).sort((a,b)=>b.qty-a.qty);
    const q=rows.reduce((a,r)=>a+r.qty,0),amt=rows.reduce((a,r)=>a+r.amount,0);
    return `<div class="sec"><h2>${l}　<span class="num">${q}杯・品 ／ ${yen(amt)}</span></h2><div class="bill">
      ${rows.length?rows.map(r=>`<div class="row"><span>${esc(r.name)}</span><span class="q num">${r.qty}</span><span class="p num">${yen(r.amount)}</span></div>`).join(''):'<div class="empty">出数なし</div>'}
    </div></div>`;
  };
  app.innerHTML=`
  <div class="bar"><h1>本日の集計</h1></div>
  <div class="main">
    <div class="hero-total">
      <small>総売上</small><b class="num">${yen(total)}</b>
      <div class="meta num">会計 ${S.sales.length}件 ・ 客単価 ${yen(S.sales.length?Math.round(total/S.sales.length):0)} ・ ${hm(S.startedAt)}〜${hm(S.endedAt)}</div>
    </div>
    ${CATS.map(block).join('')}
    <div class="note">出数は会計済みの注文のみを数えています。次に「営業開始」を押すと集計はリセットされます。</div>
  </div>
  <div class="foot"><button class="primary" id="fin" style="flex:1">最初の画面へ</button></div>`;
  fin.onclick=()=>go('start');
}

function start(){
  app.innerHTML=`
  <div class="bar"><h1></h1><button class="iconbtn" id="gear" aria-label="設定">${GEAR}</button></div>
  <div class="start"><div>
    <div class="eyebrow">ORDER PAD</div>
    <button class="openbtn" id="open">営業開始</button>
    <div class="hint">${S.tables}卓 ・ メニュー${allItems().length}品</div>
  </div></div>`;
  gear.onclick=()=>go('settings');
  document.getElementById("open").onclick=()=>{S.open=true;S.sales=[];S.startedAt=Date.now();save();go('tables')};
}

function tables(){
  let cards='';
  for(let t=1;t<=S.tables;t++){
    const {qty,sum}=tableInfo(t);
    cards+=`<button class="table ${qty?'busy':''}" data-t="${t}">
      <span class="no num">${t}<small>卓</small></span>
      <span class="st num">${qty?`${qty}点 ・ ${yen(sum)}`:'空席'}</span></button>`;
  }
  const st=salesTotal();
  app.innerHTML=`
  <div class="bar"><h1>卓を選ぶ</h1><button class="textbtn" id="close">営業終了</button></div>
  <div class="main"><div class="running num">会計済み ${S.sales.length}件 ・ 売上 <b>${yen(st)}</b></div><div class="grid">${cards}</div></div>`;
  app.querySelectorAll('.table').forEach(b=>b.onclick=()=>go('menu',{table:+b.dataset.t,expanded:new Set()}));
  document.getElementById("close").onclick=()=>{
    const busy=[...Array(S.tables)].some((_,i)=>tableInfo(i+1).qty);
    confirmBox(busy?'会計がまだの卓があります。未会計の注文は売上に含まれません。営業を終了しますか？':'営業を終了して本日の集計を表示しますか？','営業終了',()=>{S.open=false;S.endedAt=Date.now();save();go('report')});
  };
}

function menu(){
  const t=view.table,o=S.orders[t]||{};
  const items=S.menu[view.tab];
  const rows=items.length?items.map(it=>{
    const q=o[it.id]||0,show=q>0||view.expanded.has(it.id);
    return `<div class="item ${q?'on':''}" data-id="${it.id}">
      <button class="name" data-act="toggle"><b>${esc(it.name)}</b><span class="num">${yen(it.price)}</span></button>
      ${show?`<div class="step"><button data-act="minus" aria-label="${esc(it.name)}を1つ減らす">−</button><span class="c num">${q}</span><button data-act="plus" aria-label="${esc(it.name)}を1つ増やす">＋</button></div>`:''}
    </div>`}).join(''):`<div class="empty">このカテゴリにメニューがありません。<br>最初の画面の歯車から追加できます。</div>`;
  const {qty,sum}=tableInfo(t);
  app.innerHTML=`
  <div class="bar"><button class="iconbtn" id="back" aria-label="卓一覧へ戻る">${BACK}</button><h1 class="num">${t}卓</h1></div>
  <div class="tabs" role="tablist">${CATS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${view.tab===k}" data-tab="${k}">${l}</button>`).join('')}</div>
  <div class="main"><div class="list">${rows}</div></div>
  <div class="foot"><div class="sum"><small class="num">${qty}点</small><b class="num">${yen(sum)}</b></div>
    <button class="primary" id="pay" ${qty?'':'disabled'}>会計</button></div>`;
  back.onclick=()=>go('tables');
  pay.onclick=()=>go('bill');
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go('menu',{tab:b.dataset.tab}));
  app.querySelectorAll('.item').forEach(row=>row.onclick=e=>{
    const act=e.target.closest('[data-act]')?.dataset.act;if(!act)return;
    const id=row.dataset.id;S.orders[t]=S.orders[t]||{};const cur=S.orders[t][id]||0;
    if(act==='toggle'){view.expanded.has(id)&&!cur?view.expanded.delete(id):view.expanded.add(id)}
    if(act==='plus')S.orders[t][id]=cur+1;
    if(act==='minus'){if(cur>1)S.orders[t][id]=cur-1;else{delete S.orders[t][id]}}
    save();render();
  });
}

function bill(){
  const t=view.table,o=S.orders[t]||{};
  let html='';
  for(const [k,l] of CATS){
    const rows=S.menu[k].filter(it=>o[it.id]>0);
    if(!rows.length)continue;
    html+=`<div class="cat">${l}</div>`+rows.map(it=>`<div class="row"><span>${esc(it.name)}</span><span class="q num">×${o[it.id]}</span><span class="p num">${yen(it.price*o[it.id])}</span></div>`).join('');
  }
  const {qty,sum}=tableInfo(t);
  app.innerHTML=`
  <div class="bar"><button class="iconbtn" id="back" aria-label="注文に戻る">${BACK}</button><h1 class="num">${t}卓 お会計</h1></div>
  <div class="main">
    <div class="bill">${html||'<div class="empty">注文がありません</div>'}</div>
    <div class="total"><span class="num">合計 ${qty}点</span><b class="num">${yen(sum)}</b></div>
  </div>
  <div class="foot"><button class="ghost" id="edit">注文を修正</button><button class="primary" id="done" style="flex:1" ${qty?'':'disabled'}>会計済みにする</button></div>`;
  back.onclick=edit.onclick=()=>go('menu');
  done.onclick=()=>confirmBox(`${t}卓を ${yen(sum)} で会計済みにして、注文をクリアしますか？`,'会計済みにする',()=>{
    const items=[];
    for(const [k] of CATS)for(const it of S.menu[k])if(o[it.id]>0)items.push({cat:k,name:it.name,price:it.price,qty:o[it.id]});
    S.sales.push({table:t,items,total:sum,at:Date.now()});
    delete S.orders[t];save();go('tables');toast(`${t}卓の会計が完了しました`);
  });
}

function settings(){
  const sec=([k,l])=>`<div class="sec"><h2>${l}</h2><div class="card">
    ${S.menu[k].map(it=>`<div class="edit" data-cat="${k}" data-id="${it.id}">
      <input id="n-${it.id}" aria-label="メニュー名" value="${esc(it.name)}" data-f="name">
      <input id="p-${it.id}" class="price num" aria-label="金額（円）" inputmode="numeric" value="${it.price}" data-f="price">
      <button class="del" data-act="del" aria-label="${esc(it.name)}を削除">✕</button></div>`).join('')||'<div class="empty">メニューがありません</div>'}
    <button class="add" data-add="${k}">＋ ${l}を追加</button></div></div>`;
  app.innerHTML=`
  <div class="bar"><button class="iconbtn" id="back" aria-label="戻る">${BACK}</button><h1>設定</h1></div>
  <div class="main">
    <div class="sec"><h2>卓数</h2><div class="card counter">
      <span>1〜<b class="num">${S.tables}</b>卓</span>
      <div class="step"><button id="tm" aria-label="卓を減らす">−</button><span class="c num">${S.tables}</span><button id="tp" aria-label="卓を増やす">＋</button></div>
    </div></div>
    ${CATS.map(sec).join('')}
    <div class="sec"><button class="textbtn danger" id="reset">初期状態に戻す</button>
    <div class="note">金額は税込の円で入力してください。変更は自動で保存されます。</div></div>
  </div>`;
  back.onclick=()=>go('start');
  tp.onclick=()=>{if(S.tables<50){S.tables++;save();render()}};
  tm.onclick=()=>{if(S.tables<=1)return;const n=S.tables;
    const drop=()=>{delete S.orders[n];S.tables--;save();render()};
    tableInfo(n).qty?confirmBox(`${n}卓に未会計の注文があります。削除して卓を減らしますか？`,'減らす',drop):drop()};
  app.querySelectorAll('.edit input').forEach(inp=>inp.onchange=()=>{
    const r=inp.closest('.edit'),it=S.menu[r.dataset.cat].find(i=>i.id===r.dataset.id);
    if(inp.dataset.f==='name'){it.name=inp.value.trim()||it.name;inp.value=it.name}
    else{const v=parseInt(inp.value.replace(/[^\d]/g,''),10);it.price=isNaN(v)?it.price:v;inp.value=it.price}
    save();
  });
  app.querySelectorAll('[data-act="del"]').forEach(b=>b.onclick=()=>{
    const r=b.closest('.edit'),list=S.menu[r.dataset.cat],it=list.find(i=>i.id===r.dataset.id);
    confirmBox(`「${esc(it.name)}」を削除しますか？`,'削除',()=>{
      S.menu[r.dataset.cat]=list.filter(i=>i!==it);
      for(const o of Object.values(S.orders))delete o[it.id];
      save();render();
    });
  });
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const id=uid();S.menu[b.dataset.add].push({id,name:'新しいメニュー',price:0});save();render();
    const n=document.getElementById('n-'+id);n.focus();n.select();
  });
  reset.onclick=()=>confirmBox('卓数・メニュー・注文をすべて初期状態に戻しますか？','戻す',()=>{S=defaults();save();render();toast('初期状態に戻しました')});
}

function confirmBox(msg,ok,fn){
  layer.innerHTML=`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true"><p>${msg}</p>
    <div class="acts"><button class="ghost" id="dc">やめる</button><button class="primary" id="dk">${ok}</button></div></div></div>`;
  const close=()=>layer.innerHTML='';
  dc.onclick=close;dk.onclick=()=>{close();fn()};
  layer.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))close()};
  dk.focus();
}
let tt;function toast(m){clearTimeout(tt);const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);tt=setTimeout(()=>d.remove(),2200)}

render();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
